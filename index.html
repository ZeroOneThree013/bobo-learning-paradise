<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{
  --navy:#1f3a6b; --navy2:#2f5597; --blue:#3b82c8; --sky:#d6ecfb;
  --cream:#fff8e8; --paper:#fffdf6; --gold:#f7c948; --gold-d:#d9a521;
  --mint:#58c79a; --mint-bg:#e2f8ee; --mint-d:#2a8f68;
  --pink:#ff8fa3; --pink-bg:#ffe6ec; --pink-d:#c94661;
  --wood:#c98c52; --wood-d:#9c6a37;
  --ink:#24324d; --ink2:#566684; --line:#e6dcc3;
  --r:22px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);line-height:1.7;font-size:16px;
  background:linear-gradient(180deg,#e6f4fe 0%,#c3e3f8 38%,#98cbee 100%) fixed;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);background:#f2ecd9;border-radius:6px;padding:.05em .4em;font-size:.92em;color:#3b3f5c;word-break:break-word}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 背景裝飾：角色圖裡的發光小圖示 */
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters span{position:absolute;font-weight:800;color:#fff3c4;opacity:.8;
  text-shadow:0 0 12px rgba(255,236,160,.95),0 0 26px rgba(255,236,160,.6);animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 頁首 */
.top{position:sticky;top:0;z-index:20;background:rgba(255,253,246,.94);backdrop-filter:blur(8px);
  border-bottom:3px solid var(--wood);box-shadow:0 4px 14px rgba(31,58,107,.12)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:800;font-size:1.15rem}
.brand img{width:46px;height:38px;object-fit:cover;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand small{display:block;font-size:.7rem;font-weight:600;color:var(--ink2);margin-top:-4px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--navy);font-weight:700;font-size:.95rem}
nav a:hover,nav a[aria-current=page]{background:var(--gold)}
.pill{background:var(--cream);border:2px solid var(--gold);border-radius:999px;padding:3px 12px;font-weight:800;color:var(--navy);white-space:nowrap}

main{position:relative;z-index:1;flex:1;width:100%;max-width:1080px;margin:0 auto;padding:22px 16px 170px;animation:fadein .35s}

/* 卡片與按鈕 */
.card{background:var(--paper);border:3px solid #fff;border-radius:var(--r);box-shadow:0 6px 0 rgba(31,58,107,.14),0 12px 24px rgba(31,58,107,.08);padding:20px 22px}
.card + .card{margin-top:16px}
h1,h2,h3{color:var(--navy);line-height:1.3;margin:0 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.4em 0 .7em}
.muted{color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;border:0;border-radius:999px;
  background:var(--gold);color:var(--navy);font-weight:800;padding:10px 20px;text-decoration:none;
  box-shadow:0 4px 0 var(--gold-d);transition:transform .08s,box-shadow .08s;font-size:1rem}
.btn:hover{filter:brightness(1.04)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.sec{background:#fff;box-shadow:0 4px 0 #cfd8e6;border:2px solid #d9e2f0}
.btn.sec:active{box-shadow:0 1px 0 #cfd8e6}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-d)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint-d)}
.btn.sm{padding:5px 12px;font-size:.88rem;box-shadow:0 3px 0 var(--gold-d)}
.btn.sec.sm{box-shadow:0 3px 0 #cfd8e6}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* 首頁 */
.hero{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:22px;align-items:center;margin-bottom:20px}
.hero .pic{width:100%;border-radius:26px;border:5px solid #fff;box-shadow:0 8px 0 rgba(31,58,107,.15),0 16px 30px rgba(31,58,107,.18);display:block}
.bar{height:16px;background:#e8e1cb;border-radius:999px;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#8be0b9);border-radius:999px;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.unit{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;position:relative;transition:transform .15s}
.unit:hover{transform:translateY(-4px)}
.unit .no{position:absolute;top:10px;right:14px;font-weight:900;font-size:2.1rem;color:#e9dfc0}
.unit .ic{font-size:2.2rem;line-height:1}
.unit h3{margin:.1em 0 0;font-size:1.12rem}
.pips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pip{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:#eee7d2;color:#8a8266}
.pip.on{background:var(--mint-bg);color:var(--mint-d)}
.stars{font-weight:800;color:#c98a00}
.medal{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;
  background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold));border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}

/* 單元頁 */
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumb a{color:var(--navy);font-weight:700;text-decoration:none}
.tabs{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.tab{flex:1;min-width:120px;text-align:center;padding:10px 12px;border-radius:16px;background:#fff;border:3px solid #fff;color:var(--navy);font-weight:800;
  text-decoration:none;box-shadow:0 4px 0 rgba(31,58,107,.14);position:relative}
.tab[aria-current=page]{background:var(--navy);color:#fff}
.tab .done{position:absolute;top:-8px;right:-6px;background:var(--mint);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px;border:2px solid #fff}
.sup{display:inline-block;background:var(--gold);color:var(--navy);font-size:.75rem;font-weight:800;border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:middle}
pre.code{margin:.6em 0 1em;background:#22304f;color:#f3f1e6;border-radius:16px;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:.92rem;line-height:1.6;position:relative;white-space:pre}
pre.code .copy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:2px 10px;cursor:pointer;font-size:.8rem}
.dots{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.dot{width:11px;height:11px;border-radius:50%;background:#e2d9bd;border:0;padding:0;cursor:pointer}
.dot[aria-current=true]{background:var(--navy);transform:scale(1.25)}
.callout{background:var(--cream);border:2px dashed var(--gold);border-radius:16px;padding:10px 14px}

/* 題目 */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qdots{display:flex;gap:6px}
.qd{width:26px;height:8px;border-radius:99px;background:#e2d9bd}
.qd.cur{background:var(--blue)} .qd.ok{background:var(--mint)} .qd.no{background:var(--pink)}
.qtext{font-size:1.15rem;font-weight:700;margin:.3em 0 .8em}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid #e6dcc3;background:#fff;border-radius:16px;padding:12px 16px;cursor:pointer;font-weight:600;width:100%;
  box-shadow:0 4px 0 #e6dcc3}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:800;color:var(--navy)}
.opt.ok{background:var(--mint-bg);border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.opt.bad{background:var(--pink-bg);border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}
.opt[disabled]{cursor:default}
.tfs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfs .opt{justify-content:center;font-size:1.3rem;padding:18px}
.blank{font-family:var(--mono);font-size:1rem;border:0;border-bottom:3px solid var(--gold);background:#3a4a72;color:#fff;border-radius:6px 6px 0 0;padding:1px 8px;width:9ch;min-width:6ch;text-align:center}
pre.code.fillcode{font-size:1.05rem;padding:18px 16px}
.fb{margin-top:14px;border-radius:16px;padding:12px 16px;animation:pop .3s}
.fb.ok{background:var(--mint-bg);border:2px solid var(--mint)}
.fb.bad{background:var(--pink-bg);border:2px solid var(--pink)}
.fb.hint{background:#fff7d6;border:2px solid var(--gold)}
.fb b.t{display:block;font-size:1.05rem}
.result{text-align:center}
.result .big{font-size:2.4rem;font-weight:900;color:#c98a00}

/* 實作 */
.task{background:var(--cream);border:2px solid var(--gold);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.task.ok{background:var(--mint-bg);border-color:var(--mint)}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:#fff;border:2px solid #efe6cc;border-radius:16px;padding:14px}
.panel h3{font-size:1rem;margin-bottom:.4em}
.ctl{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.ctl label{font-weight:700;min-width:5.5em}
.ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--blue)}
.ctl select,.ctl input[type=text],.panel textarea,.cellin{border:2px solid #d9e2f0;border-radius:10px;padding:5px 10px;background:#fff}
.panel textarea{width:100%;font-family:var(--mono);font-size:.95rem;min-height:110px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.blk{display:flex;align-items:center;gap:8px;background:#22304f;color:#f3f1e6;border-radius:12px;padding:6px 8px 6px 14px;margin:6px 0;font-family:var(--mono);font-size:.95rem}
.blk code{background:none;color:inherit;padding:0;flex:1;word-break:break-all}
.blk button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}
.blk button:hover{background:rgba(255,255,255,.3)}
.blk button[disabled]{opacity:.3;cursor:default}
.page{background:#fff;border:1px solid #cfd6e4;box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;overflow:hidden;margin:0 auto}
.page.a4{width:100%;max-width:330px;aspect-ratio:210/297}
.ln{background:#9aa6bf;border-radius:3px}
.ln.h{background:#2a3b66}
.pg-label{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:4px;font-weight:700}
.err{background:#2b1d24;color:#ffc9d2;border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:.9rem}
.okbox{background:var(--mint-bg);color:var(--mint-d);border:2px solid var(--mint);border-radius:12px;padding:10px 14px;font-weight:700}
.warnbox{background:#fff7d6;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-weight:600}
table.tb{border-collapse:collapse;margin:8px auto}
table.tb td,table.tb th{padding:4px 10px;min-width:48px}
.cellin{width:100%;min-width:60px;padding:3px 6px;font-size:.9rem}
.scroll{overflow:auto}
.pgs{display:flex;gap:10px;overflow:auto;padding:6px 2px 10px}
.mini{flex:none;width:112px;aspect-ratio:210/297;background:#fff;border:1px solid #cfd6e4;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.15);padding:8px;font-size:.62rem;line-height:1.3;position:relative;overflow:hidden}
.mini .no{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-weight:800;font-size:.8rem;color:var(--navy)}
.mini b{display:block;color:var(--navy);font-size:.68rem}
.fig{background:#cfe6fa;border:2px dashed #7fb3e3;border-radius:6px;text-align:center;font-size:.62rem;color:#2f5597;padding:6px 2px;font-weight:700}

/* 吉祥物 */
#dock{position:fixed;right:14px;bottom:10px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;max-width:min(330px,calc(100vw - 28px))}
#dock .bubble{pointer-events:none;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:8px 14px;font-weight:700;color:var(--navy);box-shadow:0 5px 0 rgba(31,58,107,.2);
  position:relative;font-size:.95rem;line-height:1.5;animation:pop .25s}
#dock .bubble:after{content:"";position:absolute;right:46px;bottom:-14px;border:8px solid transparent;border-top-color:var(--navy)}
#dock .bubble.empty{display:none}
#dock .bobo{position:relative}
#dock .dtoggle{pointer-events:auto;position:absolute;right:-6px;top:-8px;z-index:2;width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;cursor:pointer;line-height:1;padding:0}
#dock.min .bubble,#dock.min .bobo img{display:none}
#dock.min .bobo{width:44px;height:44px}
#dock.min .dtoggle{position:static;width:44px;height:44px;font-size:1.3rem}
#dock img{display:block;width:112px;border-radius:22px;border:4px solid #fff;box-shadow:0 6px 0 rgba(31,58,107,.2),0 12px 24px rgba(31,58,107,.25);background:#fff}
#dock .bobo.idle img{animation:bob 6s ease-in-out infinite}
#dock .bobo.cheer img{animation:bounce .8s}
#dock .bobo.sad img{animation:shake .6s}
#dock .star{position:absolute;font-size:1.4rem;animation:rise 1.2s forwards;pointer-events:none}
#dock .drop{position:absolute;right:6px;top:22px;font-size:1.3rem;animation:rise 1.4s forwards;pointer-events:none}

/* 桌面（頁尾） */
.desk{position:relative;z-index:1;background:linear-gradient(#d9a066,#b97c43);border-top:6px solid var(--wood-d);color:#fff6e2;padding:16px;text-align:center;font-size:.88rem;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 38px),linear-gradient(#d9a066,#b97c43)}
.desk a{color:#fff;font-weight:700}

/* 對話框 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,35,70,.5);display:grid;place-items:center;padding:16px;animation:fadein .2s}
.modal .card{max-width:440px;width:100%;text-align:center}
.modal textarea{width:100%;min-height:90px;border:2px solid #d9e2f0;border-radius:12px;padding:8px;margin:8px 0}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;border-radius:999px;padding:8px 20px;font-weight:700;animation:pop .25s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.badge-big{font-size:4rem;animation:pop .5s}
table.prog{width:100%;border-collapse:collapse}
table.prog td,table.prog th{padding:8px 6px;border-bottom:2px dashed var(--line);text-align:left}
.tl{border-left:4px solid var(--gold);padding-left:14px;margin:8px 0}

@media (max-width:760px){
  body{font-size:15.5px}
  .hero{grid-template-columns:1fr} .hero .pic{max-width:300px;margin:0 auto}
  .labgrid{grid-template-columns:1fr}
  #dock img{width:76px;border-radius:16px;border-width:3px}
  #dock .bubble{font-size:.85rem;padding:6px 10px}
  .floaters span:nth-child(n+6){display:none}
  main{padding:16px 12px 150px}
  .card{padding:16px}
  h1{font-size:1.45rem}
  nav a{padding:5px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* 學習卡片：排出來長這樣 */
.viz{background:#f3f8ff;border:2px dashed #9ec1e6;border-radius:16px;padding:12px 14px;margin:12px 0 4px}
.viz-t{font-weight:800;color:var(--navy);font-size:.92rem;margin-bottom:8px}
.viz-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.viz-col{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:100%}
.viz-cap{font-size:.78rem;font-weight:700;color:var(--ink2);text-align:center}
.viz-arr{font-size:1.5rem;color:var(--navy);font-weight:800}
.viz-note{font-size:.85rem;color:var(--ink2);margin:8px 0 0;text-align:center}
.vp{width:150px;aspect-ratio:210/297;background:#fff;border:1px solid #cfd6e4;box-shadow:0 4px 12px rgba(0,0,0,.15);padding:11px 12px;font-size:9.5px;line-height:1.5;color:#111;position:relative;overflow:hidden;font-family:"Noto Serif TC","Times New Roman",serif;flex:none}
.vp.wide{width:190px}
.vp .vl{height:3.5px;background:#a8b2c6;border-radius:2px;margin:0 0 4px}
.vp .vl.s{width:60%}
.vp .no{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px}
.vp .box{outline:1px dashed #6aa3dc;outline-offset:0}
.vp .fn{position:absolute;left:12px;right:12px;bottom:14px;border-top:1px solid #777;padding-top:3px;font-size:8px}
.vcode{background:#22304f;color:#f3f1e6;border-radius:12px;padding:8px 10px;font-family:var(--mono);font-size:.78rem;line-height:1.55;white-space:pre;overflow:auto;max-width:100%;text-align:left}
.vcode .dim{opacity:.45}
.vcode .hl{background:rgba(255,210,77,.28);border-radius:4px}
.vbad{background:#2b1d24;color:#ffc9d2;border-radius:10px;padding:6px 10px;font-family:var(--mono);font-size:.74rem;max-width:280px;text-align:left}
.vok{background:var(--mint-bg);color:var(--mint-d);border:2px solid var(--mint);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.82rem}
.vwin{border:2px solid #b9c7e0;border-radius:12px;background:#fff;overflow:hidden;width:min(100%,430px);font-size:.78rem}
.vwin .vtop{background:#e6edf8;padding:4px 8px;font-weight:700;color:var(--navy);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vwin .vtop .b{background:#2e9e5b;color:#fff;border-radius:6px;padding:1px 8px}
.vwin .vtop .b2{background:#fff;border:1px solid #b9c7e0;border-radius:6px;padding:1px 8px}
.vwin .cols{display:grid;grid-template-columns:1fr 1fr;min-height:120px}
.vwin .cols>div{padding:8px;position:relative}
.vwin .cols>div:first-child{background:#22304f;color:#f3f1e6;font-family:var(--mono);font-size:.7rem;line-height:1.6;white-space:pre}
.vwin .cols>div:last-child{background:#eef1f6;display:flex;justify-content:center;align-items:flex-start}
.vtag{position:absolute;background:#ffd24d;color:#3b2d00;font-weight:800;border-radius:999px;padding:1px 9px;font-size:.72rem;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
.vtb{border-collapse:collapse;font-size:9px}
.vtb td{padding:2px 6px}
.vsym{border-collapse:collapse;font-size:.85rem;background:#fff}
.vsym td,.vsym th{border:1px solid #cfd6e4;padding:3px 10px;text-align:center}
.vsym th{background:#e6edf8}
@media (max-width:760px){.vp{width:128px;font-size:8.5px}.vp.wide{width:150px}}
button.pill.acct{cursor:pointer;border:2px solid var(--gold);font-weight:800;color:var(--navy);background:#fff}
button.pill.acct:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

const UNITS = [{"id": "u1", "n": 1, "icon": "🚀", "title": "起步與文件結構", "sub": "LaTeX 是什麼、Overleaf、文件骨架", "official": [{"label": "Learn LaTeX in 30 minutes", "url": "https://www.overleaf.com/learn/latex/Learn_LaTeX_in_30_minutes"}], "cards": [{"t": "LaTeX 是什麼？", "body": "LaTeX 是一套排版系統：你專心寫內容，版面、編號、目錄交給它處理。用 Word 寫報告時常遇到縮排距離不一致、標題編號對不上，用 LaTeX 比較不容易發生。\n\n它免費又開源。你寫好的語法會被「編譯」，輸出成排版整齊的 PDF。"}, {"t": "先用 Overleaf 練習", "body": "第一次接觸 LaTeX，比較省事的做法是用雲端版的 **Overleaf**：用 Email 或 Google 帳號註冊，按「建立」，就能開空白文件，也能從論文、期刊、書籍、商業信件等範本開始。\n\n編輯畫面左邊寫語法，右邊看編譯後的排版結果。範本也是學語法的好素材。", "url": "https://www.overleaf.com/learn/latex/Learn_LaTeX_in_30_minutes", "label": "官方：30 分鐘入門"}, {"t": "文件的基本骨架", "body": "`\\documentclass` 先決定文件類型：大括號放類型，一般書面報告用 `article`；方括號放輔助設定，例如字體大小 `11pt`。\n\n`\\begin{document}` 和 `\\end{document}` 是一對標籤，正文都寫在它們中間。LaTeX 的指令都以反斜線開頭。", "code": "\\documentclass[11pt]{article}\n\n\\begin{document}\nHello, LaTeX!\n\\end{document}"}, {"t": "編譯與小技巧", "body": "寫好之後，按右上角的 Recompile，或按 Ctrl + Enter，右邊就會更新成最新結果。\n\n輸入指令輸入到一半時，編輯器會跳出提示；看到符合的項目，按 Tab 或 Enter 就能自動補完。"}], "questions": [{"type": "choice", "q": "LaTeX 的指令都以哪個符號開頭？", "options": ["反斜線 \\ ", "百分比 %", "貨幣符號 $", "星號 *"], "answer": 0, "explain": "LaTeX 指令一律從反斜線開始，例如 \\documentclass、\\section。"}, {"type": "choice", "q": "寫一般書面報告時，\\documentclass 後面的大括號通常放什麼？", "options": ["article", "document", "11pt", "center"], "answer": 0, "explain": "大括號放文件類型，報告常用 article。11pt 是放在方括號的輔助設定。"}, {"type": "tf", "q": "\\begin{document} 與 \\end{document} 中間，才是文件的正文內容。", "answer": true, "explain": "沒錯，這一對標籤框住整份文件的內容；套件與設定通常寫在 \\begin{document} 之前。"}, {"type": "fill", "q": "補上文件類型，讓它成為一般報告：", "code": "\\documentclass[11pt]{___}", "answers": ["article"], "hints": ["一般書面報告用的類型，英文意思是「文章」", "a 開頭，共 7 個字母"], "explain": "article 是最常用的報告類型。其他類型還有書籍、簡報等，版面與章節設計都不一樣。"}, {"type": "fill", "q": "補完結尾標籤：", "code": "\\end{___}", "answers": ["document"], "hints": ["要和 \\begin{document} 成對", "英文意思是「文件」"], "explain": "\\begin{document} 和 \\end{document} 要成對出現。"}], "lab": {"type": "sort", "task": "把打亂的程式行排成能編譯的正確順序，再按「檢查順序」。", "lines": ["Hello, LaTeX!", "\\usepackage{geometry}", "\\end{document}", "\\documentclass[11pt]{article}", "\\begin{document}"]}}, {"id": "u2", "n": 2, "icon": "🈶", "title": "中文支援", "sub": "xeCJK 與 XeLaTeX", "official": [{"label": "Chinese（官方）", "url": "https://www.overleaf.com/learn/latex/Chinese"}], "cards": [{"t": "為什麼中文會報錯？", "body": "剛開始的 LaTeX 只有最基本的功能，就像剛買的手機，想做更多事就得再裝 App。所以直接在文件裡輸入中文，編譯會失敗。"}, {"t": "用 \\usepackage 加裝功能", "body": "`\\usepackage{套件名}` 用來擴充 LaTeX 的功能。要顯示中文，先載入 `xeCJK`，再用 `\\setCJKmainfont` 指定中文字型。\n\n可用的字型名稱可以到官方的字型清單挑選，複製進大括號即可。", "code": "\\usepackage{xeCJK}\n\\setCJKmainfont{FandolSong}", "url": "https://www.overleaf.com/learn/latex/Chinese", "label": "官方怎麼說"}, {"t": "把編譯器改成 XeLaTeX", "body": "套件裝好還不夠：到 Overleaf 左上角打開功能選單，把「編譯器」改成 **XeLaTeX**，重新編譯後，中文才會正常顯示。"}, {"t": "官方補充：官方怎麼建議", "body": "官方文件建議中文文件用 **XeLaTeX 或 LuaLaTeX** 編譯，因為它們直接支援 UTF-8 文字，也能搭配 TrueType／OpenType 字型。\n\n`xeCJK` 只能搭配 XeLaTeX。想要完整的中文在地化，也可以改用 `ctex` 系列的文件類別（例如 `ctexart`）。", "url": "https://www.overleaf.com/learn/latex/Chinese", "label": "官方：Chinese", "sup": true}], "questions": [{"type": "choice", "q": "在預設的 LaTeX 文件直接輸入中文，編譯會出錯，最主要的原因是？", "options": ["預設只有基本功能，需要加裝支援中文的套件", "電腦沒有安裝中文輸入法", "文件類型一定要改成 book", "沒有按 Ctrl + Enter"], "answer": 0, "explain": "LaTeX 剛開始只具備基本功能，要顯示中文得用 \\usepackage 加裝 xeCJK 之類的套件。"}, {"type": "choice", "q": "要讓 xeCJK 正常運作，編譯器應該設成哪一個？", "options": ["pdfLaTeX", "XeLaTeX", "BibTeX", "TeXMaker"], "answer": 1, "explain": "xeCJK 只能搭配 XeLaTeX。官方也說 LuaLaTeX 同樣適合中文，但那是另一條路。"}, {"type": "tf", "q": "xeCJK 套件可以搭配 pdfLaTeX 編譯器使用。", "answer": false, "explain": "不行。官方指出 xeCJK 只能在 XeLaTeX 下運作，所以要把編譯器切換成 XeLaTeX。"}, {"type": "fill", "q": "載入支援中文的套件：", "code": "\\usepackage{___}", "answers": ["xeCJK"], "hints": ["套件名稱以 xe 開頭", "xe 後面接 CJK（中日韓）"], "explain": "注意大小寫：xeCJK 的 CJK 要大寫。"}, {"type": "fill", "q": "指定中文主要字型的指令：", "code": "\\___{FandolSong}", "answers": ["setCJKmainfont"], "hints": ["指令名稱由 set、CJK、main、font 組成", "set + CJK + main + font，中間沒有空格"], "explain": "\\setCJKmainfont{字型名稱} 用來設定中文的主要字型。"}], "lab": {"type": "compile", "task": "補完中文設定、選對編譯器，按「編譯」讓中文成功顯示。"}}, {"id": "u3", "n": 3, "icon": "📐", "title": "章節與版面", "sub": "章節、邊界、行距、註解", "official": [{"label": "Sections and chapters", "url": "https://www.overleaf.com/learn/latex/Sections_and_chapters"}, {"label": "Page size and margins", "url": "https://www.overleaf.com/learn/latex/Page_size_and_margins"}, {"label": "Paragraph formatting", "url": "https://www.overleaf.com/learn/latex/Paragraph_formatting"}], "cards": [{"t": "章節與編號", "body": "`\\section` 標出章節標題，`\\subsection` 標出第二層的子標題。LaTeX 會自動幫標題編號，順序也一併處理，不用自己維護。", "code": "\\section{簡介}\n\\subsection{什麼是 LaTeX}", "url": "https://www.overleaf.com/learn/latex/Sections_and_chapters", "label": "官方怎麼說"}, {"t": "邊界與紙張：geometry", "body": "預設邊界對一般報告來說偏大。載入 `geometry` 套件，就能指定邊界寬度（例如 2 公分），也能分別設定上下左右，甚至自訂紙張尺寸（例如 A4）。", "code": "\\usepackage[a4paper, margin=2cm]{geometry}", "url": "https://www.overleaf.com/learn/latex/Page_size_and_margins", "label": "官方怎麼說"}, {"t": "行距與段距：setspace", "body": "報告的行距通常會加大，方便老師批註。載入 `setspace` 之後：`\\doublespacing` 是兩倍行高，`\\onehalfspacing` 是 1.5 倍。\n\n想讓段落之間的距離也寬一點，可以用 `\\setlength` 設定 `\\parskip`。", "code": "\\usepackage{setspace}\n\\onehalfspacing\n\\setlength{\\parskip}{6pt}", "url": "https://www.overleaf.com/learn/latex/Paragraph_formatting", "label": "官方怎麼說"}, {"t": "用 % 寫註解", "body": "在語法旁輸入 `%`，後面的內容就是註解，不會出現在 PDF 裡。可以拿來說明這段語法在做什麼；\n\n也能用來除錯：在某一行前面加上 `%`，這一行就暫時失效，方便比較前後的差異。", "code": "% 這是註解，不會輸出\n%\\onehalfspacing   <- 暫時停用這一行"}], "questions": [{"type": "choice", "q": "下列哪個套件用來設定邊界與紙張尺寸？", "options": ["geometry", "setspace", "graphicx", "apacite"], "answer": 0, "explain": "geometry 負責邊界與紙張；setspace 管行距；graphicx 管圖片；apacite 管參考文獻格式。"}, {"type": "choice", "q": "想把行距設成 1.5 倍，應該使用哪個指令（需先載入 setspace）？", "options": ["\\onehalfspacing", "\\doublespacing", "\\vfill", "\\centering"], "answer": 0, "explain": "\\onehalfspacing 是 1.5 倍行高，\\doublespacing 是兩倍。"}, {"type": "tf", "q": "在某一行語法前面加上 %，這一行會被暫時停用。", "answer": true, "explain": "對，% 後面都視為註解，除錯時很好用。"}, {"type": "fill", "q": "載入調整行距的套件：", "code": "\\usepackage{___}", "answers": ["setspace"], "hints": ["set 開頭，和「space（空間）」有關", "set + space"], "explain": "setspace 提供 \\doublespacing、\\onehalfspacing 等指令。"}, {"type": "fill", "q": "補完第二層標題的指令：", "code": "\\___{什麼是 LaTeX}", "answers": ["subsection"], "hints": ["比 section 多了一個前綴 sub", "sub + section"], "explain": "\\subsection 是 \\section 底下的子標題，編號會自動接在章節編號後面。"}], "lab": {"type": "layout", "task": "把邊界調成 2 cm，行距設成 1.5 倍。"}}, {"id": "u4", "n": 4, "icon": "🎓", "title": "封面製作", "sub": "置中、字級、間距、插圖", "official": [{"label": "Font sizes, families, and styles", "url": "https://www.overleaf.com/learn/latex/Font_sizes,_families,_and_styles"}, {"label": "Lengths in LaTeX", "url": "https://www.overleaf.com/learn/latex/Lengths_in_LaTeX"}, {"label": "Inserting Images", "url": "https://www.overleaf.com/learn/latex/Inserting_Images"}], "cards": [{"t": "分段與換行", "body": "編輯器裡只按一次 Enter，LaTeX 還是把相鄰的行接成同一段。要真的分段，需要空一行。\n\n另一個換行的方式是在句尾輸入兩個反斜線 `\\\\`，但這樣分開的文字本質上仍屬於同一個段落。", "code": "資訊素養\n\nLaTeX 期末報告 \\\\\n王小明"}, {"t": "置中與文字大小", "body": "用 `center` 環境把內容水平置中。文字大小的指令放在句子前面，後面的文字就會跟著縮放：`\\small` 縮小、`\\large` 放大，更大還有 `\\Huge`。\n\n全大寫的 `\\HUGE` 需要另外載入 `moresize` 套件。粗體用 `\\textbf{…}` 包住文字。", "code": "\\begin{center}\n  {\\Huge \\textbf{LaTeX 期末報告}}\n\\end{center}", "url": "https://www.overleaf.com/learn/latex/Font_sizes,_families,_and_styles", "label": "官方怎麼說"}, {"t": "垂直間距：vspace 與 vfill", "body": "`\\vspace{長度}` 在段落之間加大垂直距離。如果上方沒有任何段落（例如頁面最上面），要寫成 `\\vspace*{長度}`，才會真的留白。\n\n`\\vfill` 會把它後面的內容推到頁面底部，很適合放學生與指導教授資訊。另一種做法是在 `\\\\` 後面加方括號，例如 `\\\\[1cm]`，也能加大行距。", "code": "\\vspace*{3cm}\n...\n\\vfill\n指導教授：李老師", "url": "https://www.overleaf.com/learn/latex/Lengths_in_LaTeX", "label": "官方怎麼說"}, {"t": "插入校徽或圖片", "body": "先把圖檔上傳到 Overleaf，載入 `graphicx` 套件，再用 `\\includegraphics` 插入圖片。如果圖片太大，在方括號裡設定寬度，例如 `width=4cm`。", "code": "\\usepackage{graphicx}\n...\n\\includegraphics[width=4cm]{logo}", "url": "https://www.overleaf.com/learn/latex/Inserting_Images", "label": "官方怎麼說"}], "questions": [{"type": "choice", "q": "頁面最上方想留白，但 \\vspace 上面沒有任何段落，應該怎麼寫？", "options": ["\\vspace*{2cm}", "\\vspace{2cm}", "\\vfill{2cm}", "\\hspace*{2cm}"], "answer": 0, "explain": "上方沒有段落時，\\vspace 要加星號寫成 \\vspace*，留白才不會被忽略。"}, {"type": "choice", "q": "哪個指令能把後面的內容推到頁面底部？", "options": ["\\vfill", "\\centering", "\\textbf", "\\small"], "answer": 0, "explain": "\\vfill 會把空白填滿，讓它後面的內容貼到頁面底部。"}, {"type": "tf", "q": "\\textbf{標題} 的作用是把文字變成粗體。", "answer": true, "explain": "對，\\textbf 就是粗體。"}, {"type": "fill", "q": "讓內容水平置中的環境：", "code": "\\begin{___}", "answers": ["center"], "hints": ["英文意思是「中心」", "c 開頭，共 6 個字母"], "explain": "center 環境會讓包住的內容水平置中。"}, {"type": "fill", "q": "要插入圖片，先載入哪個套件？", "code": "\\usepackage{___}", "answers": ["graphicx"], "hints": ["名稱和 graphics（圖形）有關，結尾有個 x", "graphic + x"], "explain": "graphicx 提供 \\includegraphics，用來插入圖片。"}], "lab": {"type": "cover", "task": "做出標題置中、使用 \\HUGE、粗體，作者資訊用 \\vfill 放在底部的封面。"}}, {"id": "u5", "n": 5, "icon": "📝", "title": "註腳與清單", "sub": "footnote、itemize、enumerate", "official": [{"label": "Footnotes", "url": "https://www.overleaf.com/learn/latex/Footnotes"}, {"label": "Lists", "url": "https://www.overleaf.com/learn/latex/Lists"}], "cards": [{"t": "註腳 \\footnote", "body": "在句子裡輸入 `\\footnote{…}`，LaTeX 會把註腳文字放在該頁底部，並在標註的位置自動加上編號。\n\n另一種寫法：用 `\\footnotemark` 標記位置，再用 `\\footnotetext{…}` 把內容寫在別的地方，效果相同。", "code": "這是一句話\\footnote{這是註腳的內容。}", "url": "https://www.overleaf.com/learn/latex/Footnotes", "label": "官方怎麼說"}, {"t": "條列清單：itemize", "body": "用 `itemize` 環境建立條列清單，每個 `\\item` 是一個項目。編譯後，每個項目前面會有一個黑色圓點。", "code": "\\begin{itemize}\n  \\item 第一項\n  \\item 第二項\n\\end{itemize}", "url": "https://www.overleaf.com/learn/latex/Lists", "label": "官方怎麼說"}, {"t": "編號清單：enumerate", "body": "把環境名稱 `itemize` 改成 `enumerate`，圓點就會變成阿拉伯數字的編號。", "code": "\\begin{enumerate}\n  \\item 第一項\n  \\item 第二項\n\\end{enumerate}", "url": "https://www.overleaf.com/learn/latex/Lists", "label": "官方怎麼說"}, {"t": "換成字母或羅馬數字", "body": "想用英文字母或羅馬數字編號，先在文件開頭載入同名的 `enumerate` 套件，再在 `\\begin{enumerate}` 後面用方括號指定樣式，例如 `[(a)]`、`[A.]`、`[I)]`。\n\n編號的兩側，也可以加上括號等裝飾符號。", "code": "\\usepackage{enumerate}\n...\n\\begin{enumerate}[(a)]\n  \\item 第一項\n\\end{enumerate}", "url": "https://www.overleaf.com/learn/latex/Lists", "label": "官方怎麼說"}], "questions": [{"type": "choice", "q": "想把圓點清單改成數字編號清單，環境名稱要改成什麼？", "options": ["enumerate", "itemize", "footnote", "center"], "answer": 0, "explain": "itemize 是圓點、enumerate 是編號。"}, {"type": "choice", "q": "\\footnote{…} 裡的內容，編譯後會出現在哪裡？", "options": ["該頁的底部", "文件的最後一頁", "標題旁邊", "目錄裡"], "answer": 0, "explain": "註腳文字會放在該頁底部，並自動加上編號。"}, {"type": "tf", "q": "想用字母或羅馬數字編號，需要先載入 enumerate 套件。", "answer": true, "explain": "影片的做法是這樣：先載入同名套件，再用方括號指定編號樣式。"}, {"type": "fill", "q": "清單裡每個項目前面要寫的指令：", "code": "\\___ 第一項", "answers": ["item"], "hints": ["很短，英文意思是「項目」", "只有 4 個字母"], "explain": "每個 \\item 就是清單的一個項目。"}, {"type": "fill", "q": "補上條列清單（圓點）的環境名稱：", "code": "\\begin{___} \\item 第一項 \\end{itemize}", "answers": ["itemize"], "hints": ["item + ize", "結尾的 \\end 已經給你答案了"], "explain": "itemize 是圓點清單；題目結尾的 \\end{itemize} 就是提示。"}], "lab": {"type": "lists", "task": "做出一個「(a)、(b)、(c)」樣式的編號清單，並加上一個註腳。"}}, {"id": "u6", "n": 6, "icon": "🖼️", "title": "圖表", "sub": "figure、位置、label 與 ref", "official": [{"label": "Inserting Images", "url": "https://www.overleaf.com/learn/latex/Inserting_Images"}, {"label": "Positioning figures", "url": "https://docs.overleaf.com/writing-and-editing/inserting-images/positioning-figures"}, {"label": "Positioning images and tables", "url": "https://www.overleaf.com/learn/latex/Positioning_images_and_tables"}, {"label": "Cross referencing", "url": "https://www.overleaf.com/learn/latex/Cross_referencing_sections,_equations_and_floats"}], "cards": [{"t": "插入圖表：figure", "body": "圖檔要先上傳到 Overleaf，再用 `figure` 環境放進文件。常見的幾個標籤：`\\centering` 置中、`\\includegraphics` 指定圖檔、`\\caption` 是圖下方的說明、`\\label` 是之後參照用的記號。", "code": "\\begin{figure}[h]\n  \\centering\n  \\includegraphics[width=0.7\\textwidth]{plot}\n  \\caption{成績分布}\n  \\label{fig:plot}\n\\end{figure}", "url": "https://www.overleaf.com/learn/latex/Inserting_Images", "label": "官方怎麼說"}, {"t": "為什麼圖跑掉了？", "body": "`figure` 是「浮動體」：LaTeX 會自己決定它放在哪，所以編譯後的位置可能和原始碼不一樣。\n\n不想讓它自己決定，就在 `\\begin{figure}` 旁邊加位置參數，例如 `[h]`（here，放在這裡）；把圖片的比例縮小一點也有幫助。"}, {"t": "官方補充：位置參數全表", "body": "官方列出的位置參數：\n\n`h`：大約放在原始碼的位置（不保證精確）。\n`t`：頁面頂端。`b`：頁面底端。\n`p`：專門放浮動體的頁面。\n`!`：覆蓋 LaTeX 判斷「好位置」的內部設定。\n`H`：大致等同於 `h!`（實際使用時通常要載入 float 套件）。", "url": "https://docs.overleaf.com/writing-and-editing/inserting-images/positioning-figures", "label": "官方：Positioning figures", "sup": true}, {"t": "參照：label、ref、pageref", "body": "`\\label` 取好名字之後，在文中用 `\\ref{名字}`，LaTeX 就會把圖表的編號插進去；用 `\\pageref{名字}` 則會插入圖表所在的頁碼。\n\n注意：`\\label` 要放在 `\\caption` 後面，編號才會抓對。圖表增減時，編號會自動更新。", "code": "如圖 \\ref{fig:plot} 所示，\n詳見第 \\pageref{fig:plot} 頁。", "url": "https://www.overleaf.com/learn/latex/Cross_referencing_sections,_equations_and_floats", "label": "官方怎麼說"}], "questions": [{"type": "choice", "q": "圖編譯後的位置和原始碼不一致，最常見的處理方式是？", "options": ["在 figure 旁加位置參數，例如 [h]", "把圖片刪掉重新上傳", "改用 Word 排版", "把 caption 刪掉"], "answer": 0, "explain": "figure 是浮動體，加上 [h] 可以要求它放在原始碼附近。"}, {"type": "choice", "q": "哪個位置參數代表「放在頁面頂端」？", "options": ["t", "b", "h", "p"], "answer": 0, "explain": "t = top（頂端）、b = bottom（底端）、h = here（這裡）、p = 浮動體專用頁。"}, {"type": "tf", "q": "\\pageref{名字} 會把該圖表所在的頁碼插入文中。", "answer": true, "explain": "對。\\ref 插入編號，\\pageref 插入頁碼。"}, {"type": "fill", "q": "在文中參照圖表的編號：如圖", "code": "\\___{fig:plot} 所示", "answers": ["ref"], "hints": ["三個字母，是 reference（參照）的縮寫", "r 開頭"], "explain": "\\ref{名字} 會自動換成圖表的編號。"}, {"type": "fill", "q": "圖表下方的說明文字指令：", "code": "\\___{成績分布}", "answers": ["caption"], "hints": ["英文意思是「標題、說明文字」", "c 開頭，共 7 個字母"], "explain": "\\caption{…} 會在圖或表旁邊加上說明，並自動編號。"}], "lab": {"type": "float", "task": "先讓圖片出現在頁面頂端（t），再把 label 與 ref 的名字填對。"}}, {"id": "u7", "n": 7, "icon": "📊", "title": "表格", "sub": "tabular 與表格產生器", "official": [{"label": "Tables", "url": "https://www.overleaf.com/learn/latex/Tables"}, {"label": "Generating and inserting tables", "url": "https://docs.overleaf.com/writing-and-editing/generating-and-inserting-tables"}], "cards": [{"t": "表格的基本結構", "body": "`tabular` 標出表格的開始和結束。旁邊大括號裡，一個字母代表一欄：`c` 置中、`l` 靠左、`r` 靠右；字母之間的 `|` 表示垂直線。\n\n水平線用 `\\hline`。同一列的各格用 `&` 隔開，換行用 `\\\\`。", "code": "\\begin{tabular}{|c|c|c|}\n  \\hline\n  姓名 & 科目 & 分數 \\\\\n  \\hline\n  小明 & 數學 & 90 \\\\\n  \\hline\n\\end{tabular}", "url": "https://www.overleaf.com/learn/latex/Tables", "label": "官方怎麼說"}, {"t": "加上標題與位置", "body": "表格和圖表很像：外面包一層 `table` 環境，就能置中、加標題 `\\caption`、設定 `\\label` 讓文中參照，也可以用 `[h]` 控制位置。", "code": "\\begin{table}[h]\n  \\centering\n  \\begin{tabular}{|c|c|}\n    ...\n  \\end{tabular}\n  \\caption{成績表}\n  \\label{tab:score}\n\\end{table}"}, {"t": "官方補充：不用全部手寫", "body": "手寫表格語法對初學者不太直覺。影片示範用網路上的表格產生器：貼上 Word 或 Excel 的資料，設定對齊、粗體、格線，就能輸出語法。\n\n官方文件提到，Overleaf 現在也有 Insert Table 按鈕和自己的表格產生器。下一頁的實作，就是小博做的簡易版產生器。", "url": "https://docs.overleaf.com/writing-and-editing/generating-and-inserting-tables", "label": "官方：表格產生器", "sup": true}, {"t": "特殊符號要小心", "body": "`&`、`%`、`$`、`#`、`_` 在 LaTeX 裡有特殊用途。如果表格內容真的要出現這些字元，前面要加反斜線，例如寫成 `\\&`、`\\%`。\n\nBoBo 的產生器會幫你自動處理這件事。"}], "questions": [{"type": "choice", "q": "表格欄位設定 {|c|c|c|} 代表什麼？", "options": ["三欄、每欄置中，欄與欄之間有垂直線", "三列、每列置中", "三個獨立的表格", "三種不同的顏色"], "answer": 0, "explain": "一個字母是一欄，c 是置中，| 是垂直線。"}, {"type": "choice", "q": "同一列裡，不同格的資料要用哪個符號隔開？", "options": ["&", "\\\\", "%", "$"], "answer": 0, "explain": "格與格之間用 &；一列結束要換行時才用 \\\\。"}, {"type": "tf", "q": "\\hline 的作用是畫水平格線。", "answer": true, "explain": "對，\\hline 畫一條橫線；直線則靠欄位設定裡的 |。"}, {"type": "fill", "q": "欄位設定中，要讓文字靠左對齊的字母：", "code": "\\begin{tabular}{|c|___|c|}", "answers": ["l"], "hints": ["是 left（左）的第一個字母", "小寫的 L"], "explain": "l = left 靠左、c = center 置中、r = right 靠右。"}, {"type": "fill", "q": "一列結束、要換行時，在列尾寫：", "code": "小明 & 數學 & 90 ___", "answers": ["\\\\"], "hints": ["和文字換行用的是同一個符號", "兩個反斜線"], "explain": "列尾用兩個反斜線 \\\\ 換行。"}], "lab": {"type": "table", "task": "做出一個 3 欄以上、每欄都置中、有垂直線與水平線的表格。"}}, {"id": "u8", "n": 8, "icon": "➗", "title": "數學公式", "sub": "根號、分數、求和", "official": [{"label": "Mathematical expressions", "url": "https://www.overleaf.com/learn/latex/Mathematical_expressions"}, {"label": "Fractions and Binomials", "url": "https://www.overleaf.com/learn/latex/Fractions_and_Binomials"}, {"label": "Integrals, sums and limits", "url": "https://www.overleaf.com/learn/latex/Integrals,_sums_and_limits"}], "cards": [{"t": "兩種寫法", "body": "許多研究者選擇 LaTeX，是因為它能快速做出整齊美觀的數學公式。公式有兩種寫法：\n\n寫在段落裡（行內公式）：公式前後各加一個 `$`。\n自成一段（獨立公式）：用 `\\[` 和 `\\]` 把公式包起來。", "code": "行內公式：$a^2 + b^2 = c^2$\n\n獨立公式：\n\\[ a^2 + b^2 = c^2 \\]", "url": "https://www.overleaf.com/learn/latex/Mathematical_expressions", "label": "官方怎麼說"}, {"t": "根號與分數", "body": "`\\sqrt{…}` 是根號，大括號裡放被開方的數。`\\frac{分子}{分母}` 是分數：先寫分子、再寫分母，各用一組大括號。", "code": "\\sqrt{x + 1}\n\\frac{a}{b}", "url": "https://www.overleaf.com/learn/latex/Fractions_and_Binomials", "label": "官方怎麼說"}, {"t": "求和符號", "body": "`\\sum` 是 Sigma 求和符號。下標（起始值）用底線 `_`，上標（結束值）用 `^`；內容超過一個字元時，要用大括號包起來。", "code": "\\sum_{i=1}^{n} i", "url": "https://www.overleaf.com/learn/latex/Integrals,_sums_and_limits", "label": "官方怎麼說"}, {"t": "在 BoBo 試試看", "body": "下一頁的實作有一個公式編輯器：輸入語法，右邊就會即時畫出公式。語法寫錯時，會用簡單的話告訴你哪裡有問題。"}], "questions": [{"type": "choice", "q": "想讓公式獨立成一個段落，應該用哪種寫法？", "options": ["\\[ 公式 \\]", "$ 公式 $", "% 公式 %", "\\begin{tabular}"], "answer": 0, "explain": "獨立公式用 \\[ 和 \\] 包住；前後各一個 $ 的是行內公式。"}, {"type": "choice", "q": "在 \\frac{a}{b} 中，a 是什麼？", "options": ["分子", "分母", "指數", "下標"], "answer": 0, "explain": "\\frac 先寫分子、後寫分母，所以 a 是分子，b 是分母。"}, {"type": "tf", "q": "行內公式是在公式的兩側各加一個 $ 符號。", "answer": true, "explain": "對，這樣公式就會嵌在文字行裡。"}, {"type": "fill", "q": "根號的指令：", "code": "\\___{x}", "answers": ["sqrt"], "hints": ["square root 的縮寫", "s 開頭，共 4 個字母"], "explain": "\\sqrt 取自 square root（平方根）。"}, {"type": "fill", "q": "Sigma 求和的指令：", "code": "\\____{i=1}^{n} i", "answers": ["sum"], "hints": ["英文意思是「總和」", "只有 3 個字母"], "explain": "\\sum 是求和符號，下標放起始值、上標放結束值。"}], "lab": {"type": "math", "task": "寫出一個同時有分數與根號的公式（例如二次公式），並看它即時顯示出來。"}}, {"id": "u9", "n": 9, "icon": "📚", "title": "參考文獻", "sub": ".bib、cite、bibliography", "official": [{"label": "Bibliography management with bibtex", "url": "https://www.overleaf.com/learn/latex/Bibliography_management_with_bibtex"}, {"label": "Bibliography management with biblatex", "url": "https://www.overleaf.com/learn/latex/Bibliography_management_with_biblatex"}], "cards": [{"t": "準備 .bib 檔", "body": "文獻資料放在副檔名為 `.bib` 的檔案裡。先在 Overleaf 新增一個空白文件，副檔名設成 `.bib`。\n\n接著到網路上找到要引用的文獻，點「引用」，再選 BibTeX，就會出現一段語法；複製後貼進 `.bib` 檔，重複同樣步驟加入其他文獻。（下面是虛構的範例。）", "code": "@article{smith2021,\n  author  = {Smith, Amy},\n  title   = {An Example Article},\n  journal = {Example Journal},\n  year    = {2021}\n}", "url": "https://www.overleaf.com/learn/latex/Bibliography_management_with_bibtex", "label": "官方怎麼說"}, {"t": "在文件裡接上書目", "body": "文件開頭先載入 `apacite` 套件。在想放參考文獻的地方（影片先用 `\\newpage` 換一頁），用 `\\bibliography{檔名}` 匯入書目，再用 `\\bibliographystyle{…}` 指定清單格式。\n\n`\\bibliography` 後面的檔名不用加 `.bib`。", "code": "\\usepackage{apacite}\n...\n\\newpage\n\\bibliographystyle{apacite}\n\\bibliography{refs}"}, {"t": "用 \\cite 引用", "body": "文章裡用 `\\cite{鍵值}` 引用文獻，鍵值就是 `.bib` 裡 `@article{` 後面的名字。編譯時 LaTeX 會把文中引用到的文獻，自動彙整到參考文獻頁面。\n\n在 Overleaf 上，需要重複編譯才能完成的步驟會自動處理，不必自己多按幾次。", "code": "這種做法很常見 \\cite{smith2021}。", "url": "https://www.overleaf.com/learn/latex/Bibliography_management_with_bibtex", "label": "官方怎麼說"}, {"t": "官方補充：新專案可考慮 biblatex", "body": "官方文件提到，如果是從零開始的新專案，建議使用 **biblatex**：它支援多語系、持續維護，管理起來更彈性。\n\n影片示範的 `apacite` 搭配 BibTeX 仍然可以用，適合需要 APA 格式的情境。", "url": "https://www.overleaf.com/learn/latex/Bibliography_management_with_biblatex", "label": "官方：biblatex", "sup": true}], "questions": [{"type": "choice", "q": "存放參考文獻資料的檔案，副檔名是什麼？", "options": [".bib", ".tex", ".pdf", ".png"], "answer": 0, "explain": "文獻資料庫放在 .bib 檔；.tex 是文件本身。"}, {"type": "choice", "q": "文章中要引用文獻，使用哪個指令？", "options": ["\\cite{鍵值}", "\\ref{鍵值}", "\\footnote{鍵值}", "\\label{鍵值}"], "answer": 0, "explain": "\\cite 引用文獻；\\ref 是參照圖表、章節編號。"}, {"type": "tf", "q": "匯入書目時，\\bibliography{refs} 的檔名要寫成 refs.bib。", "answer": false, "explain": "不用加副檔名，寫 \\bibliography{refs} 就會讀 refs.bib。"}, {"type": "fill", "q": "文中引用文獻：", "code": "\\___{smith2021}", "answers": ["cite"], "hints": ["英文意思是「引用」", "c 開頭，共 4 個字母"], "explain": "\\cite{鍵值} 會在文中放入引用，並把文獻收進參考文獻清單。"}, {"type": "fill", "q": "匯入書目檔 refs.bib：", "code": "\\___{refs}", "answers": ["bibliography"], "hints": ["名字就是「書目」的英文，很長", "biblio + graphy"], "explain": "\\bibliography{檔名} 用來匯入書目檔，檔名不含 .bib。"}], "lab": {"type": "cite", "task": "引用至少兩篇文獻，並加上 \\bibliographystyle 與 \\bibliography 兩行，讓參考文獻出現。"}}, {"id": "u10", "n": 10, "icon": "🔖", "title": "目錄與頁碼", "sub": "目錄、羅馬數字、重設頁碼", "official": [{"label": "Table of contents", "url": "https://www.overleaf.com/learn/latex/Table_of_contents"}, {"label": "Page numbering", "url": "https://www.overleaf.com/learn/latex/Page_numbering"}], "cards": [{"t": "自動產生目錄", "body": "`\\tableofcontents` 會擷取所有章節與子章節的標題，自動生成目錄。章節或頁碼變動時，重新編譯就會更新。", "code": "\\tableofcontents", "url": "https://www.overleaf.com/learn/latex/Table_of_contents", "label": "官方怎麼說"}, {"t": "不想進目錄：加星號", "body": "在 `\\section` 後面加一個星號，標題就不會編號，也不會列入目錄。像「摘要」這種頁面就很適合。\n\n參考文獻的標題也可以用額外設定從目錄排除。", "code": "\\section*{摘要}"}, {"t": "分頁與改目錄標題", "body": "摘要、目錄通常各自一頁，所以在它們前面各插入一個 `\\newpage`（分頁）。\n\n目錄的預設標題是英文的 Contents，可以用 `\\renewcommand*\\contentsname{…}` 改成中文。", "code": "\\newpage\n\\renewcommand*\\contentsname{目錄}\n\\tableofcontents", "url": "https://www.overleaf.com/learn/latex/Table_of_contents", "label": "官方：改目錄標題的範例", "sup": true}, {"t": "羅馬數字與重設頁碼", "body": "摘要和目錄的頁碼，通常用羅馬數字。用 `\\pagenumbering{roman}` 設定格式；等到正文開始，再改回 `arabic`，頁碼就會從第 1 頁重新計算。", "code": "\\pagenumbering{roman}\n... 摘要、目錄 ...\n\\newpage\n\\pagenumbering{arabic}\n... 正文 ...", "url": "https://www.overleaf.com/learn/latex/Page_numbering", "label": "官方怎麼說"}], "questions": [{"type": "choice", "q": "產生目錄的指令是哪一個？", "options": ["\\tableofcontents", "\\listoffigures", "\\maketitle", "\\newpage"], "answer": 0, "explain": "\\tableofcontents 產生目錄；\\listoffigures 則是圖目錄。"}, {"type": "choice", "q": "「摘要」章節不想列入目錄，標題要怎麼寫？", "options": ["\\section*{摘要}", "\\section{摘要}", "\\subsection{摘要}", "\\newpage{摘要}"], "answer": 0, "explain": "加星號的 \\section* 不編號，也不會進目錄。"}, {"type": "tf", "q": "\\pagenumbering{arabic} 會改成阿拉伯數字，並讓頁碼從第 1 頁重新計算。", "answer": true, "explain": "對。這正是正文開始時常用的做法。"}, {"type": "fill", "q": "把摘要與目錄的頁碼改成羅馬數字：", "code": "\\pagenumbering{___}", "answers": ["roman"], "hints": ["英文意思是「羅馬的」", "r 開頭，共 5 個字母"], "explain": "roman 是小寫羅馬數字 i、ii、iii。"}, {"type": "fill", "q": "在摘要、目錄前插入分頁：", "code": "\\___", "answers": ["newpage", "clearpage"], "hints": ["英文意思是「新的一頁」", "new + page"], "explain": "\\newpage 會開新的一頁（\\clearpage 也可以，兩者在有浮動體時略有不同）。"}], "lab": {"type": "pageno", "task": "讓摘要不進目錄、前面頁碼用羅馬數字、正文從 1 重新開始，並且摘要、目錄、正文各自分頁。"}}];

<script>
/* ---------- 共用小工具 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 簡易標記：`code`、**粗體**、空行分段
function md(s) {
  return String(s).split(/\n\n/).map(p =>
    '<p>' + esc(p).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</p>'
  ).join('');
}
function codeHTML(src, extra) {
  return '<pre class="code ' + (extra || '') + '"><button class="copy" type="button" data-act="copy" aria-label="複製程式碼">複製</button><code>' + esc(src) + '</code></pre>';
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(() => true, () => legacyCopy(t));
  }
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t) {
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
const OVERLEAF_NOTE = '這裡是簡化模擬，真正的編譯結果請到 Overleaf 確認。';

/* ---------- 十個實作元件（簡化模擬） ---------- */
const Labs = {};
const mkLines = (n, h) => Array.from({ length: n }, (_, i) => '<div class="ln' + (h && i === 0 ? ' h' : '') + '" style="height:' + (h && i === 0 ? 7 : 4) + 'px;margin:' + (h && i === 0 ? '0 0 8px' : '0 0 5px') + (i % 5 === 4 ? ';width:60%' : '') + '"></div>').join('');

/* u1：排序 */
Labs.sort = (root, u, api) => {
  const right = [String.raw`\documentclass[11pt]{article}`, String.raw`\usepackage{geometry}`, String.raw`\begin{document}`, 'Hello, LaTeX!', String.raw`\end{document}`];
  let arr = u.lab.lines.slice();
  const draw = (msg) => {
    root.innerHTML = '<div class="panel"><h3>把程式行排成正確順序</h3>' + arr.map((l, i) => '<div class="blk"><code>' + esc(l) + '</code><button type="button" data-m="-1" data-i="' + i + '" aria-label="上移"' + (i === 0 ? ' disabled' : '') + '>↑</button><button type="button" data-m="1" data-i="' + i + '" aria-label="下移"' + (i === arr.length - 1 ? ' disabled' : '') + '>↓</button></div>').join('') +
      '<div class="row" style="margin-top:10px"><button class="btn" type="button" id="chk">檢查順序</button></div><div id="msg" style="margin-top:10px">' + (msg || '') + '</div></div>';
    $$('.blk button', root).forEach(b => b.onclick = () => { const i = +b.dataset.i, j = i + +b.dataset.m;[arr[i], arr[j]] = [arr[j], arr[i]]; draw(); });
    $('#chk', root).onclick = () => {
      if (arr.join('\n') === right.join('\n')) { draw('<div class="okbox">✔ 順序正確，可以編譯了！</div>'); api.done(); }
      else {
        const pos = {}; right.forEach((l, i) => pos[l] = i);
        let m = '再想想：';
        if (arr.indexOf(right[0]) !== 0) m += '最前面要先宣告文件類別。'; else if (arr.indexOf(right[2]) < arr.indexOf(right[1])) m += '套件要在 \\begin{document} 之前載入。'; else m += '內容要放在 begin 和 end 之間。';
        draw('<div class="warnbox">' + esc(m) + '</div>'); api.say('差一點點！看看提示。', 'think');
      }
    };
  };
  draw();
};

/* u2：中文編譯 */
Labs.compile = (root, u, api) => {
  const init = String.raw`\documentclass{article}
% 在這裡補上中文設定
\begin{document}
你好，LaTeX！
\end{document}`;
  root.innerHTML = '<div class="labgrid"><div class="panel"><h3>編輯器</h3><textarea id="src" spellcheck="false" style="min-height:190px">' + esc(init) + '</textarea>' +
    '<div class="ctl"><label for="cmp">編譯器</label><select id="cmp"><option>pdfLaTeX</option><option>XeLaTeX</option><option>LuaLaTeX</option></select></div>' +
    '<div class="row"><button class="btn" type="button" id="go">▶ 編譯</button><button class="btn sec sm" type="button" id="tip">💡 提示</button></div></div>' +
    '<div class="panel"><h3>結果</h3><div id="out" class="muted">按「編譯」看看。</div></div></div>';
  const out = $('#out', root);
  $('#tip', root).onclick = () => { out.innerHTML = '<div class="warnbox">需要兩行：<code>\\usepackage{xeCJK}</code> 和 <code>\\setCJKmainfont{字型}</code>（例如 <code>Noto Serif CJK TC</code>），而且編譯器要選 XeLaTeX。</div>'; api.say(pick(THINK), 'think'); };
  $('#go', root).onclick = () => {
    const s = $('#src', root).value, c = $('#cmp', root).value;
    const hasPkg = /\\usepackage(\[[^\]]*\])?\{[^}]*xeCJK[^}]*\}/.test(s), hasFont = /\\setCJKmainfont(\[[^\]]*\])?\{[^}]+\}/.test(s);
    if (!hasPkg) { out.innerHTML = '<div class="err">! LaTeX Error: Unicode character 你 (U+4F60) not set up for use with LaTeX.<br>→ 還沒載入中文套件（xeCJK）。</div>'; api.say(pick(SAD), 'sad'); return; }
    if (c === 'pdfLaTeX') { out.innerHTML = '<div class="err">! Package xeCJK Error: package xeCJK 只能搭配 XeLaTeX 使用。<br>→ 請把編譯器換成 XeLaTeX。</div>'; api.say(pick(SAD), 'sad'); return; }
    if (c === 'LuaLaTeX') { out.innerHTML = '<div class="err">xeCJK 只支援 XeLaTeX；LuaLaTeX 要改用 luatexja 之類的套件。<br>→ 這一題請選 XeLaTeX。</div>'; return; }
    if (!hasFont) { out.innerHTML = '<div class="err">Package fontspec Error: 找不到可用的中文字型。<br>→ 請用 \\setCJKmainfont 指定字型。</div>'; api.say(pick(SAD), 'sad'); return; }
    out.innerHTML = '<div class="okbox">✔ 編譯成功！</div><div class="page a4" style="margin-top:10px;padding:22px 20px"><div style="font-size:1.1rem;color:#111">你好，LaTeX！</div></div>'; api.done();
  };
};

/* u3：邊界與行距 */
Labs.layout = (root, u, api) => {
  root.innerHTML = '<div class="labgrid"><div class="panel"><h3>調整版面</h3>' +
    '<div class="ctl"><label for="mg">邊界</label><input id="mg" type="range" min="1" max="4" step="0.5" value="3"><b id="mgv"></b></div>' +
    '<div class="ctl"><label for="ls">行距</label><input id="ls" type="range" min="1" max="2" step="0.25" value="1"><b id="lsv"></b></div>' +
    '<h3 style="margin-top:12px">對應的語法</h3><pre class="code" id="gen" style="margin:0"></pre><div id="msg" style="margin-top:10px"></div></div>' +
    '<div><div class="page a4" id="pg"></div><div class="pg-label">A4 預覽（示意）</div></div></div>';
  const upd = () => {
    const m = +$('#mg', root).value, l = +$('#ls', root).value;
    $('#mgv', root).textContent = m + ' cm'; $('#lsv', root).textContent = l + ' 倍';
    const pad = m / 21 * 100;
    $('#pg', root).innerHTML = '<div style="position:absolute;left:' + pad + '%;right:' + pad + '%;top:' + (m / 29.7 * 100) + '%;bottom:' + (m / 29.7 * 100) + '%;overflow:hidden;outline:1px dashed #9ec1e6">' +
      Array.from({ length: 40 }, (_, i) => '<div class="ln' + (i === 0 ? ' h' : '') + '" style="height:4px;margin-bottom:' + (3 + l * 4) + 'px;' + (i % 7 === 6 ? 'width:55%' : '') + '"></div>').join('') + '</div>';
    $('#gen', root).textContent = '\\usepackage[margin=' + m + 'cm]{geometry}\n\\usepackage{setspace}\n\\setstretch{' + l + '}';
    if (m === 2 && l === 1.5) { $('#msg', root).innerHTML = '<div class="okbox">✔ 邊界 2 cm、行距 1.5 倍！</div>'; api.done(); } else $('#msg', root).innerHTML = '';
  };
  $('#mg', root).oninput = upd; $('#ls', root).oninput = upd; upd();
};

/* u4：封面 */
Labs.cover = (root, u, api) => {
  const opts = [['ctr', '標題置中 (\\centering)'], ['huge', '使用 \\HUGE 放大'], ['bold', '粗體 (\\textbf)'], ['vfill', '作者資訊用 \\vfill 推到底部']];
  root.innerHTML = '<div class="labgrid"><div class="panel"><h3>封面設定</h3>' + opts.map(o => '<label class="chk"><input type="checkbox" data-k="' + o[0] + '"> ' + esc(o[1]) + '</label>').join('') +
    '<h3 style="margin-top:12px">語法</h3><pre class="code" id="gen" style="margin:0"></pre><div id="msg" style="margin-top:10px"></div></div>' +
    '<div><div class="page a4" id="pg" style="display:flex;flex-direction:column;padding:12%"></div><div class="pg-label">封面預覽（示意）</div></div></div>';
  const upd = () => {
    const k = {}; $$('input', root).forEach(i => k[i.dataset.k] = i.checked);
    let code = '\\begin{titlepage}\n' + (k.ctr ? '  \\centering\n' : '') + '  ' + (k.huge ? '{\\HUGE ' : '') + (k.bold ? '\\textbf{我的專題報告}' : '我的專題報告') + (k.huge ? '}' : '') + '\n' + (k.vfill ? '  \\vfill\n' : '') + '  作者：小明\n\\end{titlepage}';

/* u7：表格產生器 */
Labs.table = (root, u, api) => {
  let R = 3, C = 3, al = 'l', vl = false, hl = false;
  const cells = {};
  const draw = () => {
    let t = '<table class="tb">';
    for (let r = 0; r < R; r++) { t += '<tr>'; for (let c = 0; c < C; c++) t += '<td><input class="cellin" data-r="' + r + '" data-c="' + c + '" aria-label="第' + (r + 1) + '列第' + (c + 1) + '欄" value="' + esc(cells[r + ',' + c] || '') + '"></td>'; t += '</tr>'; }
    t += '</table>';
    root.innerHTML = '<div class="labgrid"><div class="panel"><h3>表格產生器</h3><div class="ctl"><label for="R">列數</label><input id="R" type="number" min="1" max="6" value="' + R + '" style="width:4.5em"><label for="C" style="min-width:3em">欄數</label><input id="C" type="number" min="1" max="6" value="' + C + '" style="width:4.5em"></div>' +
      '<div class="ctl"><label for="al">對齊</label><select id="al"><option value="l"' + (al === 'l' ? ' selected' : '') + '>靠左 l</option><option value="c"' + (al === 'c' ? ' selected' : '') + '>置中 c</option><option value="r"' + (al === 'r' ? ' selected' : '') + '>靠右 r</option></select></div>' +
      '<label class="chk"><input type="checkbox" id="vl"' + (vl ? ' checked' : '') + '> 垂直線</label><label class="chk"><input type="checkbox" id="hl"' + (hl ? ' checked' : '') + '> 水平線</label><div class="scroll">' + t + '</div></div>' +
      '<div class="panel"><h3>產生的 LaTeX</h3><pre class="code" id="gen" style="margin:0"></pre><div id="msg" style="margin-top:10px"></div></div></div>';
    const ng = () => {
      const sep = vl ? '|' : '', spec = sep + Array(C).fill(al).join(sep) + sep, h = hl ? '\\hline\n' : '';
      let s = '\\begin{tabular}{' + spec + '}\n' + h;
      for (let r = 0; r < R; r++) { s += Array.from({ length: C }, (_, c) => cells[r + ',' + c] || ' ').join(' & ') + ' \\\\\n' + h; }
      s += '\\end{tabular}';
      $('#gen', root).textContent = s;
      if (C >= 3 && al === 'c' && vl && hl) { $('#msg', root).innerHTML = '<div class="okbox">✔ 符合任務！複製到 Overleaf 試試看。</div>'; api.done(); } else $('#msg', root).innerHTML = '';
    };
    $$('.cellin', root).forEach(i => i.oninput = () => { cells[i.dataset.r + ',' + i.dataset.c] = i.value; ng(); });
    const num = (id, f) => { $(id, root).onchange = e => { f(Math.max(1, Math.min(6, +e.target.value || 1))); draw(); }; };
    num('#R', v => R = v); num('#C', v => C = v);
    $('#al', root).onchange = e => { al = e.target.value; ng(); };
    $('#vl', root).onchange = e => { vl = e.target.checked; ng(); };
    $('#hl', root).onchange = e => { hl = e.target.checked; ng(); };
    ng();
  };
  draw();
};

/* u9：參考文獻 */
Labs.cite = (root, u, api) => {
  const bib = { smith2020: 'Smith, J. (2020). 學習排版的第一步. 虛構期刊, 12(3), 1–10.', lee2021: 'Lee, A. (2021). 論文寫作入門. 虛構出版社.', wang2022: 'Wang, B. (2022). 文獻管理的小技巧. 虛構研討會論文集, 45–52.' };
  const init = '這是一個重要觀點 \\cite{smith2020}。\n另一篇研究也這樣說 \\cite{}。\n\n';
  root.innerHTML = '<div class="labgrid"><div class="panel"><h3>references.bib 裡的文獻（虛構）</h3>' + Object.keys(bib).map(k => '<div class="muted"><code>' + k + '</code>　' + esc(bib[k]) + '</div>').join('') +
    '<h3 style="margin-top:12px">main.tex 內文</h3><textarea id="t" spellcheck="false" style="min-height:140px">' + esc(init) + '</textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn" type="button" id="go">▶ 編譯</button></div></div><div class="panel"><h3>結果</h3><div id="out" class="muted">補上引用與兩行參考文獻指令後編譯。</div></div></div>';
  $('#go', root).onclick = () => {
    const s = $('#t', root).value, keys = []; let m; const re = /\\cite\{([^}]*)\}/g;
    while ((m = re.exec(s))) m[1].split(',').map(x => x.trim()).filter(Boolean).forEach(k => keys.push(k));
    const bad = keys.filter(k => !bib[k]), uniq = Array.from(new Set(keys.filter(k => bib[k])));
    const hasStyle = /\\bibliographystyle\{[^}]+\}/.test(s), hasBib = /\\bibliography\{[^}]+\}/.test(s);
    const out = $('#out', root);
    let h = '';
    if (bad.length) h += '<div class="err">Warning: Citation ' + bad.map(esc).join(', ') + ' undefined → [?]</div>';
    if (!hasStyle || !hasBib) h += '<div class="warnbox" style="margin-top:8px">少了 ' + (!hasStyle ? '\\bibliographystyle{plain} ' : '') + (!hasBib ? '\\bibliography{references}' : '') + '，參考文獻不會出現。</div>';
    if (uniq.length >= 2 && hasStyle && hasBib && !bad.length) {
      const order = uniq.slice().sort();
      h = '<div class="okbox">✔ 編譯成功！</div><div class="page" style="padding:14px;margin-top:10px;color:#111;font-size:.85rem"><p>' + esc(s.replace(/\\cite\{[^}]*\}/g, c => '[' + (c.match(/\{([^}]*)\}/)[1].split(',').map(k => order.indexOf(k.trim()) + 1).join(',')) + ']').replace(/\\bibliograph\w*\{[^}]*\}/g, '').trim()).replace(/\n/g, '<br>') + '</p><h4>參考文獻</h4>' + order.map((k, i) => '<p>[' + (i + 1) + '] ' + esc(bib[k]) + '</p>').join('') + '</div>';
      out.innerHTML = h; api.done(); return;
    }
    out.innerHTML = h || '<div class="warnbox">至少要引用兩篇不同的文獻。</div>'; api.say(pick(THINK), 'think');
  };
};

const Mascot = {
  timer: null,
  init() {
    $('#dock').innerHTML = '<div class="bubble empty" id="bubble" aria-live="polite"></div><div class="bobo idle" id="bobo"><img id="bimg" alt="小博（Bobo）吉祥物" src="' + MASCOT.happy + '"><button class="dtoggle" type="button" id="dtoggle" aria-label="收起小博" title="收起／展開小博">×</button></div>';

  },
  set(mood) {
    const bobo = $('#bobo'), img = $('#bimg');
    if (!bobo) return;
    img.src = MASCOT[mood] || MASCOT.happy;
    bobo.className = 'bobo';
    bobo.querySelectorAll('.star,.drop').forEach(n => n.remove());
    void bobo.offsetWidth;
    bobo.className = 'bobo ' + (mood === 'happy' ? 'idle' : (mood === 'think' ? '' : mood));
    if (mood === 'cheer') {
      ['⭐', '✨', '🌟', '✨'].forEach((s, i) => {
        const n = document.createElement('span'); n.className = 'star'; n.textContent = s;
        n.style.left = (10 + i * 32) + 'px'; n.style.top = (10 + (i % 2) * 24) + 'px'; n.style.animationDelay = (i * .12) + 's';
        bobo.appendChild(n); setTimeout(() => n.remove(), 1600);

      bobo.appendChild(n); setTimeout(() => n.remove(), 1700);
    }
    clearTimeout(this.timer);
    if (mood !== 'happy') this.timer = setTimeout(() => this.set('happy'), mood === 'think' ? 9000 : 5000);
  },
  say(text, mood) {
    const b = $('#bubble');
    if (b && text) { b.textContent = text; b.classList.remove('empty'); clearTimeout(this.btimer); this.btimer = setTimeout(() => this.hide(), 6000); }

  },

  } else {

/* ---------- 雲端題庫與回饋（選配） ---------- */
function rowToQ(r) {
  try {
    const type = String(r.type || '').trim().toLowerCase(), q = String(r.q || '').trim();
    if (!q) return null;
    const body = String(r.body == null ? '' : r.body), ans = String(r.answer == null ? '' : r.answer).trim();
    const hints = String(r.hints || '').split('||').map(s => s.trim()).filter(Boolean);
    const base = { q, explain: String(r.explain || '').trim() || '（沒有解析）' };
    if (type === 'choice') {
      const options = body.split('||').map(s => s.trim()).filter(Boolean), a = parseInt(ans, 10) - 1;
      if (options.length < 2 || !(a >= 0 && a < options.length)) return null;
      return Object.assign(base, { type: 'choice', options, answer: a });
    }
    if (type === 'tf') return Object.assign(base, { type: 'tf', answer: /^(對|是|true|t|yes|y|1)$/i.test(ans) });
    if (type === 'fill') {
      const answers = ans.split('||').map(s => s.trim()).filter(Boolean);
      if (!/_{3,}/.test(body) || !answers.length) return null;
      return Object.assign(base, { type: 'fill', code: body, answers, hints: hints.length ? hints : ['再想想看～'] });
    }
  } catch (e) { }
  return null;
}
function applyCloud(rows) {
  const by = {};
  rows.forEach(r => {
    let id = String(r.unit == null ? '' : r.unit).trim(); if (/^\d+$/.test(id)) id = 'u' + id;
    if (!byId[id]) return;
    const q = rowToQ(r); if (q) (by[id] = by[id] || []).push(q);
  });
  let n = 0;
  Object.keys(by).forEach(id => { byId[id].questions = by[id]; n += by[id].length; });
  return n;
}
async function loadCloud() {
  const url = (CONFIG.GAS_URL || '').trim();
  if (!url) { cloud = 'off'; return; }
  cloud = 'loading';
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'action=questions', { signal: ctl.signal });
    const j = await r.json();
    if (!j || !Array.isArray(j.questions)) throw new Error('format');
    const n = applyCloud(j.questions);
    cloud = n > 0 ? 'ok' : 'fail';
    if (n > 0) { Q = null; toast('已載入雲端題庫（' + n + ' 題）'); }
  } catch (e) { cloud = 'fail'; } finally { clearTimeout(t); }
  flushFeedback();
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'about' || (p[0] === 'u' && p[2] === 'quiz')) renderKeep();
}
function queueFb(p) { try { const q = JSON.parse(localStorage.getItem(FB_KEY) || '[]'); q.push(p); localStorage.setItem(FB_KEY, JSON.stringify(q.slice(-30))); } catch (e) { } }
function postFb(p) {
  return fetch(CONFIG.GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
}
async function flushFeedback() {
  if (!CONFIG.GAS_URL || cloud !== 'ok') return;
  let q = []; try { q = JSON.parse(localStorage.getItem(FB_KEY) || '[]'); } catch (e) { }
  if (!q.length) return;
  try { for (const p of q) await postFb(p); localStorage.removeItem(FB_KEY); } catch (e) { }
}
async function sendFeedback(p) {
  if (!CONFIG.GAS_URL || cloud === 'fail') { queueFb(p); toast('目前沒有連上雲端，意見先存在這台裝置。'); return; }
  try { await postFb(p); toast('已送出，謝謝你的回饋！'); } catch (e) { queueFb(p); toast('送出失敗，意見先存在這台裝置。'); }
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, u = curUnit();
  if (act === 'close') { closeModal(); return; }
  if (act === 'copy') { const t = el.parentElement.querySelector('code').textContent; copyText(t).then(ok => { el.textContent = ok ? '已複製 ✔' : '請手動複製'; setTimeout(() => { el.textContent = '複製'; }, 1500); }); return; }
  if (act === 'reset') {
    showModal('<h2>要重設所有進度嗎？</h2><p>星星、徽章與完成紀錄都會被清除，無法復原。</p><div class="row" style="justify-content:center"><button class="btn sec" type="button" data-act="close">先不要</button><button class="btn" type="button" data-act="reset-ok">確定重設</button></div>'); return;
  }
  if (act === 'reset-ok') { S = { v: 1, u: {} }; save(); Q = null; closeModal(); toast('進度已重設'); render(true); return; }
  if (act === 'card' && u) { LI[u.id] = +el.dataset.i; renderKeep(); return; }
  if (act === 'learned' && u) { U(u.id).learn = true; save(); toast('📖 學習完成！換驗證囉'); Mascot.say('很好！來看看你學會了多少。', 'cheer'); checkBadge(u); location.hash = '#/u/' + u.id + '/quiz'; return; }
  if (!u) return;
  const q = Q && u.questions[Q.i];
  if (act === 'opt' && q && Q.phase === 'ask') { Q.last = +el.dataset.i; const ok = Q.last === q.answer; awardQ(u, ok ? 1 : 0); afterAnswer(ok); renderTop(); return; }
  if (act === 'tf' && q && Q.phase === 'ask') { Q.last = el.dataset.v === 'true'; const ok = Q.last === q.answer; awardQ(u, ok ? 1 : 0); afterAnswer(ok); renderTop(); return; }
  if (act === 'fillhint' && q && Q.phase === 'ask') {
    Q.hint = true; Q.hintN = Math.min(q.hints.length, Math.max(Q.hintN + 1, 1));
    const inp = $('#fillin'); Q.last = inp ? inp.value : null; Mascot.say(pick(THINK), 'think'); renderKeep(); const i2 = $('#fillin'); if (i2) i2.focus(); return;
  }
  if (act === 'fillchk' && q && Q.phase === 'ask') {
    const inp = $('#fillin'); const v = inp ? inp.value : '';
    if (!v.trim()) { toast('先填入答案再檢查喔'); if (inp) inp.focus(); return; }
    Q.tries++; Q.last = v;
    if (fillOK(v, q.answers)) { awardQ(u, (Q.tries === 1 && !Q.hint) ? 2 : 1); afterAnswer(true); renderTop(); }
    else if (Q.tries >= 3) { awardQ(u, 0); afterAnswer(false); }
    else {
      Q.hintN = Math.min(q.hints.length, Math.max(Q.hintN, Q.tries)); Q.msg = '還不太對，再試一次！';
      Mascot.say(pick(SAD), 'sad'); renderKeep(); const i2 = $('#fillin'); if (i2) { i2.focus(); i2.select(); }
    }
    return;
  }
  if (act === 'qnext' && Q) {
    Q.i++; Q.phase = 'ask'; Q.tries = 0; Q.hint = false; Q.hintN = 0; Q.msg = ''; Q.last = null; Q.stars = 0;
    if (Q.i >= u.questions.length) {
      U(u.id).quizDone = true; save(); renderTop();
      const max = umax(u), got = (Q.runStars || []).reduce((s, v) => s + (v || 0), 0);
      Mascot.say(got >= max * .7 ? '太棒了！你的成績很漂亮！' : '做完了！再複習一下會更穩喔。', got >= max * .7 ? 'cheer' : 'think');
      renderKeep(); checkBadge(u); return;
    }
    renderKeep(); return;
  }
  if (act === 'qretry') { Q = newQ(u.id); renderKeep(); return; }
  if (act === 'report' && q) {
    showModal('<h2>🚩 這題有問題？</h2><p class="muted">告訴小博哪裡怪怪的（題目、答案或解析都可以）。</p><textarea id="fbtext" maxlength="300" aria-label="意見內容"></textarea><div class="row" style="justify-content:center"><button class="btn sec" type="button" data-act="close">取消</button><button class="btn" type="button" data-act="report-send">送出</button></div>'); return;
  }
  if (act === 'report-send' && Q) {
    const msg = ($('#fbtext').value || '').trim(); if (!msg) { toast('先寫一點意見喔'); return; }
    const qq = u.questions[Q.i];
    closeModal(); sendFeedback({ unit: u.id, q: Q.i + 1, text: String(qq.q).slice(0, 80), msg, t: new Date().toISOString() }); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target && e.target.id === 'fillin') { e.preventDefault(); const b = $('[data-act=fillchk]'); if (b) b.click(); }
});
window.addEventListener('hashchange', () => { closeModal(); render(false); });

/* ---------- 啟動 ---------- */
function boot() {
  const bg = ['+', '−', '÷', '×', '♪', '♫', 'ABC', '</>', '⚛', '⚙', '∑', '√'];
  const pos = [[6, 12], [88, 10], [14, 40], [92, 38], [4, 68], [90, 66], [24, 82], [78, 84], [48, 6], [60, 90], [34, 20], [70, 30]];
  $('#floaters').innerHTML = bg.map((s, i) => '<span style="left:' + pos[i][0] + '%;top:' + pos[i][1] + '%;font-size:' + (22 + (i * 7) % 20) + 'px;animation-delay:' + (-i * 1.1) + 's">' + esc(s) + '</span>').join('');
  Mascot.init();
  if (typeof Acct !== 'undefined') Acct.init();
  render(false);
  loadCloud();
}
window.__katexReady = () => { hydrateMath(); if (window.__mathHook) window.__mathHook(); };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

/* ---------- 帳號、同步與匯出（選配：要設定 GAS_URL 與 GOOGLE_CLIENT_ID 才會出現登入） ---------- */
const ACCT_KEY = 'bobo-acct-v1';
const Acct = {
  s: null,            // { session, email, name }
  status: 'idle',     // idle | syncing | ok | fail
  last: 0, timer: null, busy: false,
  enabled() { return !!(CONFIG.GAS_URL && CONFIG.GOOGLE_CLIENT_ID); },
  init() {
    try { this.s = JSON.parse(localStorage.getItem(ACCT_KEY)); } catch (e) { this.s = null; }
    if (this.s && !(this.s.session && this.s.email)) this.s = null;
    if (this.s && this.enabled()) this.sync(true);
  },
  chip() {
    if (!this.enabled()) return '';
    return '<button class="pill acct" type="button" data-act="acct" title="' + (this.s ? esc(this.s.email) : '登入後可同步進度') + '">' + (this.s ? '👤 ' + esc(this.s.name || this.s.email.split('@')[0]) : '👤 登入') + '</button>';
  },
  persist() { try { localStorage.setItem(ACCT_KEY, JSON.stringify(this.s)); } catch (e) { } },
  clear() { this.s = null; try { localStorage.removeItem(ACCT_KEY); } catch (e) { } },
  async call(body) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal });
      return await r.json();
    } finally { clearTimeout(t); }
  },
  expired() { this.clear(); this.status = 'idle'; toast('登入已過期，請重新登入'); renderTop(); },
  dirty() { if (!this.s || !this.enabled()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(false), 2000); },
  // 把本機進度送上去；伺服器合併後回傳，再合併回本機
  async sync(refresh) {
    if (!this.s || this.busy) return;
    this.busy = true; this.status = 'syncing'; this.paint();
    try {
      const r = await this.call({ action: 'save', session: this.s.session, progress: S });
      if (!r.ok) { if (r.error === 'session') { this.expired(); return; } throw new Error(r.error); }
      this.status = 'ok'; this.last = r.updatedAt || Date.now();
      if (applyRemote(r.progress) && refresh) { renderTop(); renderKeep(); }
    } catch (e) { this.status = 'fail'; } finally { this.busy = false; this.paint(); }
  },
  paint() {
    const el = $('#acctst'); if (!el) return;
    el.textContent = { idle: '', syncing: '同步中…', ok: '✔ 已同步' + (this.last ? '（' + new Date(this.last).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) + '）' : ''), fail: '⚠ 同步失敗，稍後會再試（進度仍存在這台裝置）' }[this.status];
  }
};

/* ---- 合併規則（與伺服器相同）：星星取最高分，完成與徽章只增不減 ---- */
function cleanProg(d) {
  const out = { v: 1, u: {} };
  if (!d || typeof d !== 'object' || !d.u || typeof d.u !== 'object') return out;
  Object.keys(d.u).forEach(id => {
    if (!byId[id]) return;
    const x = d.u[id] || {}, o = { learn: !!x.learn, quizDone: !!x.quizDone, lab: !!x.lab, badged: !!x.badged, q: {} };
    Object.keys(x.q || {}).forEach(k => { if (/^u\d{1,3}-q\d{1,2}$/.test(k)) o.q[k] = Math.max(0, Math.min(2, Number(x.q[k]) || 0)); });
    out.u[id] = o;
  });
  return out;
}
function mergeProg(a, b) {
  a = cleanProg(a); b = cleanProg(b);
  const out = { v: 1, u: {} };
  new Set(Object.keys(a.u).concat(Object.keys(b.u))).forEach(id => {
    const x = a.u[id] || { q: {} }, y = b.u[id] || { q: {} };
    const o = { learn: !!(x.learn || y.learn), quizDone: !!(x.quizDone || y.quizDone), lab: !!(x.lab || y.lab), badged: !!(x.badged || y.badged), q: {} };
    new Set(Object.keys(x.q).concat(Object.keys(y.q))).forEach(k => { o.q[k] = Math.max(x.q[k] || 0, y.q[k] || 0); });
    out.u[id] = o;
  });
  return out;
}
// 合併進本機；回傳本機是否有變動
function applyRemote(remote) {
  const before = JSON.stringify(cleanProg(S)), m = mergeProg(S, remote);
  if (JSON.stringify(m) === before) return false;
  S = m; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
  return true;
}

/* ---- 匯出 ---- */
function reportRows() {
  return UN.map(u => { const x = U(u.id); return { title: u.n + '. ' + u.title, learn: x.learn ? 1 : 0, quiz: x.quizDone ? 1 : 0, lab: x.lab ? 1 : 0, stars: ustars(u), max: umax(u), badge: x.badged ? 1 : 0 }; });
}
function download(name, text, type) {
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type }));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); };
function exportJSON() { download('bobo-progress-' + today() + '.json', JSON.stringify({ app: 'bobo', exportedAt: new Date().toISOString(), progress: cleanProg(S) }, null, 2), 'application/json'); }
function exportCSV() {
  const q = s => /[",\n]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : s;
  const rows = reportRows();
  download('bobo-progress-' + today() + '.csv', '﻿單元,學習,驗證,實作,星星,滿分,徽章\n' + rows.map(r => [q(r.title), r.learn, r.quiz, r.lab, r.stars, r.max, r.badge].join(',')).join('\n'), 'text/csv');
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result), p = j && j.progress ? j.progress : j;
      if (!p || !p.u) throw new Error('format');
      const ch = applyRemote(p); save(); renderTop(); renderKeep();
      toast(ch ? '已載入進度（與目前的進度合併）' : '檔案裡沒有比目前更新的進度');
    } catch (e) { toast('這個檔案看起來不是 BoBo 的進度檔'); }
  };
  rd.onerror = () => toast('讀取檔案失敗'); rd.readAsText(file);
}

/* ---- 登入視窗 ---- */
function loadGIS() {
  return new Promise((res, rej) => {
    if (window.google && window.google.accounts && window.google.accounts.id) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    const t = setTimeout(() => rej(new Error('timeout')), 8000);
    s.onload = () => { clearTimeout(t); res(); }; s.onerror = () => { clearTimeout(t); rej(new Error('load')); };
    document.head.appendChild(s);
  });
}
async function onGoogle(resp) {
  try {
    const r = await Acct.call({ action: 'login', idToken: resp.credential });
    if (!r.ok) { toast(r.error === 'auth' ? '登入驗證失敗，請再試一次' : '登入失敗'); return; }
    Acct.s = { session: r.session, email: r.email, name: r.name }; Acct.persist(); Acct.status = 'ok'; Acct.last = r.updatedAt || Date.now();
    applyRemote(r.progress); Acct.sync(false);
    closeModal(); toast('已登入：' + r.email); Mascot.say('歡迎回來！你的進度會自動備份。', 'cheer'); renderTop(); renderKeep();
  } catch (e) { toast('連不上雲端，先用訪客模式也能學習'); }
}
function acctModal() {
  if (!Acct.s) {
    showModal('<h2>👤 登入並同步進度</h2><p>用 Google 帳號登入後，進度會自動備份到雲端，換裝置也能繼續；也能把成績單寄到你的 Gmail。</p>' +
      '<p class="muted" style="font-size:.9rem">只會記錄你的 Google 帳號 Email 與學習進度，不會取得密碼。不登入也能完整學習。</p>' +
      '<div id="gbtn" style="display:flex;justify-content:center;min-height:44px;margin:10px 0"><span class="muted">載入登入按鈕中…</span></div>' +
      '<div class="row" style="justify-content:center"><button class="btn sec" type="button" data-act="close">先不登入</button></div>');
    loadGIS().then(() => {
      window.google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onGoogle, ux_mode: 'popup' });
      const el = $('#gbtn'); if (el) { el.innerHTML = ''; window.google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' }); }
    }).catch(() => { const el = $('#gbtn'); if (el) el.innerHTML = '<div class="warnbox">登入元件載入失敗（可能離線或被擋住）。你仍可用訪客模式，進度存在這台裝置。</div>'; });
  } else {
    showModal('<h2>👤 已登入</h2><p><strong>' + esc(Acct.s.email) + '</strong></p><p id="acctst" class="muted"></p>' +
      '<div class="row" style="justify-content:center"><button class="btn sec" type="button" data-act="acct-sync">🔄 立即同步</button><button class="btn" type="button" data-act="acct-mail">📧 寄成績單到我的 Gmail</button></div>' +
      '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sec sm" type="button" data-act="acct-out">登出</button><button class="btn sec sm" type="button" data-act="close">關閉</button></div>');
    Acct.paint();
  }
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'acct') acctModal();
  else if (act === 'acct-sync') { await Acct.sync(true); if (Acct.status === 'ok') toast('已同步'); }
  else if (act === 'acct-out') { try { await Acct.call({ action: 'logout', session: Acct.s.session }); } catch (x) { } Acct.clear(); closeModal(); renderTop(); toast('已登出，進度仍保留在這台裝置'); }
  else if (act === 'acct-mail') {
    el.disabled = true; const old = el.textContent; el.textContent = '寄送中…';
    try {
      await Acct.sync(false);
      const r = await Acct.call({ action: 'mail', session: Acct.s.session, report: { rows: reportRows() } });
      if (r.ok) toast('已寄到 ' + r.to + '（也請看一下垃圾郵件匣）');
      else if (r.error === 'limit') toast('今天寄太多次了，明天再試');
      else if (r.error === 'session') Acct.expired();
      else toast('寄送失敗，請稍後再試');
    } catch (x) { toast('連不上雲端，寄送失敗'); }
    el.disabled = false; el.textContent = old;
  }
  else if (act === 'exp-json') exportJSON();
  else if (act === 'exp-csv') exportCSV();
  else if (act === 'imp') { const f = $('#impfile'); if (f) f.click(); }
});
document.addEventListener('change', e => { if (e.target && e.target.id === 'impfile' && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; } });
